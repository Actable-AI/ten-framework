name: Lint Commit Messages

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/configs/commitlint.config.mjs
